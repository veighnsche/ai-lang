name: verifier backend gate

on:
  push:
  pull_request:

jobs:
  z3-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y z3
      # The verifier's integer control probes execute against the
      # real backend: 2*x==1 must be unsat over Int (no 1/2 witness),
      # and 0<x<1 must be unsat (no integer strictly between).
      - run: |
          printf '(declare-const x Int)\n(assert (= (* 2 x) 1))\n(check-sat)\n' | z3 -in | grep -q '^unsat$'
          printf '(declare-const x Int)\n(assert (> x 0))\n(assert (< x 1))\n(check-sat)\n' | z3 -in | grep -q '^unsat$'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
